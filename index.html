<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Faizan Farz Uloom Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,700&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem('ffu-theme')==='dark'||(!localStorage.getItem('ffu-theme')&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{ui:['"Plus Jakarta Sans"','system-ui','sans-serif'],read:['Literata','Georgia','serif']}}}}</script>
<style type="text/tailwindcss">
  .w{@apply cursor-pointer rounded-md px-0.5 -mx-0.5 transition-colors duration-100 hover:bg-indigo-100 hover:text-indigo-900 dark:hover:bg-indigo-400/25 dark:hover:text-white}
  .w.on{@apply bg-amber-300 text-slate-900 dark:bg-amber-400 dark:text-slate-900}
  .para{@apply flex gap-3 items-start rounded-2xl -mx-3 px-3 py-2 transition-colors}
  .para.playing{@apply bg-indigo-500/10 ring-1 ring-indigo-400/40}
  .spk{@apply mt-1.5 shrink-0 w-8 h-8 rounded-full grid place-items-center bg-indigo-100 text-indigo-600 hover:bg-indigo-600 hover:text-white transition dark:bg-indigo-400/15 dark:text-indigo-300 dark:hover:bg-indigo-400 dark:hover:text-slate-900}
  .ctl{@apply w-10 h-10 rounded-full grid place-items-center text-slate-600 hover:bg-slate-100 transition dark:text-slate-300 dark:hover:bg-white/10}
  input[type=range]{@apply appearance-none h-2 rounded-full bg-slate-200 dark:bg-white/15 cursor-pointer w-full}
  input[type=range]::-webkit-slider-thumb{@apply appearance-none w-4 h-4 rounded-full bg-indigo-600 border-2 border-white shadow dark:border-slate-900}
  input[type=range]::-moz-range-thumb{@apply w-4 h-4 rounded-full bg-indigo-600 border-2 border-white}
  :focus-visible{outline:2px solid #6366f1;outline-offset:2px}
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:rgba(99,102,241,.3);border-radius:8px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
  #sidebar, #readerMain, #audioDock { transition: transform 200ms ease, padding-left 200ms ease, left 200ms ease; }
  body.sidebar-collapsed #sidebar { transform: translateX(-100%); }
  body.sidebar-collapsed #readerMain { padding-left: 0; }
  body.sidebar-collapsed #audioDock { left: 0; }
  #sidebarScrim { display: none; }
  @media (min-width: 768px) and (max-width: 1023px) {
    #sidebar { width: 17rem; }
    #readerMain { padding-left: 17rem; }
    #audioDock { left: 17rem; }
    header.fixed { gap: .5rem; padding-left: .75rem; padding-right: .75rem; }
    #voiceSelect { width: 14rem; }
    #themeBtn { padding-left: .75rem; padding-right: .75rem; }
  }
  @media (max-width: 767px) {
    body { overflow-x: hidden; }
    header.fixed {
      height: auto;
      min-height: 0;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "brand theme" "voice voice";
      gap: .5rem .625rem;
      padding: .5rem .75rem;
    }
    header > div:first-child { grid-area: brand; gap: .5rem; }
    header > div:nth-child(2) { grid-area: voice; width: 100%; min-width: 0; }
    header > div:nth-child(3) { grid-area: theme; }
    header .w-10.h-10 { width: 2.25rem; height: 2.25rem; }
    header h1 { font-size: .9rem; }
    #sidebarToggle, #themeBtn { min-height: 2.75rem; }
    header > div:nth-child(2) select { width: 100%; min-width: 0; min-height: 2.75rem; }
    #sidebar {
      top: 0;
      bottom: 0;
      z-index: 60;
      width: min(86vw, 21rem);
      transform: translateX(-105%);
      background-color: rgb(255 255 255 / .97);
    }
    .dark #sidebar { background-color: rgb(2 6 23 / .97); }
    body.mobile-sidebar-open #sidebar { transform: translateX(0); }
    #sidebarScrim {
      position: fixed;
      inset: 0;
      z-index: 55;
      border: 0;
      background: rgb(15 23 42 / .45);
      backdrop-filter: blur(2px);
    }
    body.mobile-sidebar-open #sidebarScrim { display: block; }
    #readerMain { padding: 7.5rem 0 15rem; }
    #reader { padding: 1.5rem .875rem; }
    #notice { padding-left: .875rem; padding-right: .875rem; }
    #reader > div:first-child { margin-bottom: 1.5rem; }
    #reader h2 { font-size: clamp(1.65rem, 7vw, 2.25rem); line-height: 1.2; overflow-wrap: anywhere; }
    #reader section { border-radius: 1.25rem; }
    #reader section > div { padding: 1.25rem 1rem; }
    #reader .para { gap: .5rem; margin-left: -.25rem; margin-right: -.25rem; padding: .5rem .25rem; }
    #reader .para p { min-width: 0; font-size: 1.0625rem; line-height: 1.85; overflow-wrap: anywhere; }
    #reader .spk { width: 2.75rem; height: 2.75rem; margin-top: .125rem; }
    #reader > div:last-child { gap: .625rem; }
    #reader > div:last-child button { min-width: 0; flex: 1; padding: .75rem .5rem; font-size: .8rem; }
    #audioDock {
      left: 0;
      right: 0;
      bottom: calc(.5rem + env(safe-area-inset-bottom));
      padding: 0 .5rem;
    }
    #player { border-radius: 1.25rem; padding: .75rem; }
    #player > .flex.items-center.gap-4 {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: .375rem .5rem;
    }
    #player > .flex.items-center.gap-4 > label {
      grid-column: 1 / -1;
      justify-self: end;
      font-size: .8rem;
    }
    #player .flex.justify-between span:last-child { display: none; }
    #player .ctl { width: 2.75rem; height: 2.75rem; }
  }
  @media (max-width: 380px) {
    header.fixed { padding-left: .5rem; padding-right: .5rem; }
    header h1 { font-size: .8rem; }
    #themeBtn { gap: .35rem; padding: .5rem; font-size: .75rem; }
    #themeBtn span { display: none; }
    #reader { padding-left: .625rem; padding-right: .625rem; }
    #reader .para p { font-size: 1rem; }
    #player > .flex.items-center.gap-4 { grid-template-columns: auto minmax(0, 1fr); }
  }
</style>
</head>
<body class="font-ui bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-200 antialiased">

<!-- Background glow -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
  <div class="absolute -top-32 left-1/4 w-[34rem] h-[34rem] rounded-full bg-indigo-300/40 blur-3xl dark:bg-indigo-600/20"></div>
  <div class="absolute top-1/3 -right-24 w-[30rem] h-[30rem] rounded-full bg-pink-300/40 blur-3xl dark:bg-fuchsia-600/15"></div>
  <div class="absolute -bottom-40 left-1/3 w-[32rem] h-[32rem] rounded-full bg-teal-300/40 blur-3xl dark:bg-teal-500/15"></div>
</div>

<!-- Navbar -->
<header class="fixed top-0 inset-x-0 h-16 z-40 grid grid-cols-[1fr_auto_1fr] items-center gap-4 px-6 bg-white/75 backdrop-blur-xl border-b border-slate-200/80 dark:bg-slate-950/70 dark:border-white/10">
  <div class="flex items-center gap-3 min-w-0">
    <button id="sidebarToggle" type="button" aria-label="Close chapters sidebar" aria-expanded="true" aria-controls="sidebar" title="Close chapters sidebar" class="ctl shrink-0 border border-slate-200 bg-white shadow-sm dark:bg-slate-900 dark:border-white/10">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 via-violet-500 to-fuchsia-500 grid place-items-center text-white shadow-lg shadow-indigo-500/30">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M8 7h8M8 11h5"/></svg>
    </div>
    <div class="min-w-0 leading-tight">
      <h1 class="font-extrabold text-[17px] tracking-tight truncate">Faizan Farz Uloom Book</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400">By: Ali Ahmad</p>
    </div>
  </div>

  <div class="flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 shadow-sm dark:bg-slate-900 dark:border-white/10">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 text-indigo-500"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
    <select id="voiceSelect" aria-label="Voice and accent" class="w-80 bg-transparent py-2.5 text-sm font-medium focus:outline-none dark:[&>option]:bg-slate-900"><option>Loading voices…</option></select>
  </div>

  <div class="flex justify-end">
    <button id="themeBtn" aria-label="Toggle light and dark mode" class="flex items-center gap-2 rounded-xl px-4 py-2 text-sm font-semibold border border-slate-200 bg-white hover:bg-slate-50 shadow-sm transition dark:bg-slate-900 dark:border-white/10 dark:hover:bg-slate-800">
      <svg class="w-4 h-4 text-amber-500 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="w-4 h-4 text-indigo-300 hidden dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span class="dark:hidden">Dark mode</span><span class="hidden dark:inline">Light mode</span>
    </button>
  </div>
</header>

<!-- Sidebar -->
<aside id="sidebar" class="fixed left-0 top-16 bottom-0 w-80 z-30 flex flex-col bg-white/70 backdrop-blur-xl border-r border-slate-200/80 dark:bg-slate-950/60 dark:border-white/10">
  <div class="p-4 pb-2">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-bold text-sm">Chapters</h2>
      <span id="chCount" class="text-xs font-semibold rounded-full px-2.5 py-1 bg-indigo-100 text-indigo-700 dark:bg-indigo-400/15 dark:text-indigo-300">0</span>
    </div>
    <input id="chSearch" type="search" placeholder="Search chapters" class="w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 dark:bg-slate-900 dark:border-white/10">
  </div>
  <nav id="chList" class="flex-1 overflow-y-auto px-3 py-2 space-y-1"></nav>
</aside>
<button id="sidebarScrim" type="button" aria-label="Close chapters sidebar"></button>

<!-- Reader -->
<main id="readerMain" class="pl-80 pt-16 pb-48">
  <div id="notice" class="hidden mx-auto max-w-5xl mt-6 px-8"></div>
  <article id="reader" class="mx-auto max-w-5xl px-8 py-12"></article>
</main>

<!-- Audio player popup -->
<div id="audioDock" class="fixed bottom-5 left-80 right-0 px-8 z-50 pointer-events-none">
  <div id="player" class="mx-auto max-w-3xl translate-y-[160%] opacity-0 transition duration-300 pointer-events-none rounded-3xl border border-slate-200 bg-white/90 backdrop-blur-xl shadow-2xl shadow-indigo-500/20 p-4 dark:bg-slate-900/90 dark:border-white/10">
    <div class="flex items-center gap-3 mb-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-fuchsia-500 grid place-items-center text-white shrink-0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
      </div>
      <p id="pTitle" class="flex-1 min-w-0 truncate text-sm font-semibold"></p>
      <button id="pClose" class="ctl" aria-label="Close player"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-4 h-4"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-1">
        <button id="pBack" class="ctl" title="Back 10 words" aria-label="Back 10 words"><svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" class="w-5 h-5"><polygon points="11 19 2 12 11 5"/><polygon points="22 19 13 12 22 5"/></svg></button>
        <button id="pPlay" class="w-12 h-12 rounded-full grid place-items-center text-white bg-gradient-to-br from-indigo-500 to-violet-600 shadow-lg shadow-indigo-500/40 hover:scale-105 transition" aria-label="Play or pause"></button>
        <button id="pFwd" class="ctl" title="Forward 10 words" aria-label="Forward 10 words"><svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" class="w-5 h-5"><polygon points="13 19 22 12 13 5"/><polygon points="2 19 11 12 2 5"/></svg></button>
      </div>
      <div class="flex-1">
        <input id="pSeek" type="range" min="0" max="0" value="0" aria-label="Seek">
        <div class="flex justify-between mt-1.5 text-xs font-medium text-slate-500 dark:text-slate-400"><span id="pPos">0 / 0 words</span><span>Drag to jump back or ahead</span></div>
      </div>
      <label class="flex items-center gap-2 text-sm font-semibold">Speed
        <select id="pRate" class="rounded-lg border border-slate-200 bg-white px-2 py-1.5 text-sm focus:outline-none dark:bg-slate-800 dark:border-white/10">
          <option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="0.9" selected>0.9x</option><option value="1">1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option>
        </select>
      </label>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const synth = window.speechSynthesis;
const esc = t => t.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path d="M8 5v14l11-7z"/></svg>';
const PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';

/* ---------- Theme ---------- */
$('#themeBtn').onclick = () => {
  const dark = document.documentElement.classList.toggle('dark');
  store.set('ffu-theme', dark ? 'dark' : 'light');
};

/* ---------- Voices ---------- */
let voices = [], voice = null;
function loadVoices() {
  const all = synth.getVoices();
  voices = all.filter(v => /^en/i.test(v.lang));
  if (!voices.length) voices = all;
  const sel = $('#voiceSelect');
  if (!voices.length) { sel.innerHTML = '<option>No voices found in this browser</option>'; return; }
  sel.innerHTML = voices.map(v => `<option value="${esc(v.voiceURI)}">${esc(v.name)} (${v.lang})</option>`).join('');
  const keep = voice && voices.find(v => v.voiceURI === voice.voiceURI);
  const saved = voices.find(v => v.voiceURI === store.get('ffu-voice'));
  voice = keep || saved
    || voices.find(v => /^en-US/i.test(v.lang) && /natural|online|google/i.test(v.name))
    || voices.find(v => /^en-GB/i.test(v.lang) && /natural|online|google/i.test(v.name))
    || voices.find(v => /^en-US/i.test(v.lang)) || voices[0];
  sel.value = voice.voiceURI;
}
$('#voiceSelect').onchange = e => {
  voice = voices.find(v => v.voiceURI === e.target.value) || voice;
  store.set('ffu-voice', voice.voiceURI);
  if (P.playing) playFrom(P.idx);
};
synth.onvoiceschanged = loadVoices;
loadVoices();

/* ---------- Book + chapters ---------- */
let chapters = [], cur = 0, paras = [];

function setBook(data) {
  chapters = (data.chapters || data || []);
  $('#chCount').textContent = chapters.length;
  renderList();
  openChapter(0);
}
function renderList() {
  const q = $('#chSearch').value.trim().toLowerCase();
  $('#chList').innerHTML = chapters.map((c, i) => ({c, i}))
    .filter(({c}) => c.chapter_title.toLowerCase().includes(q))
    .map(({c, i}) => {
      const on = i === cur;
      return `<button data-ch="${i}" class="group w-full flex items-start gap-3 text-left rounded-xl px-3 py-2.5 text-sm font-medium transition ${on
        ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-500/30'
        : 'hover:bg-indigo-50 dark:hover:bg-white/5'}">
        <span class="shrink-0 w-6 h-6 rounded-lg grid place-items-center text-xs font-bold ${on ? 'bg-white/20' : 'bg-slate-100 text-slate-500 dark:bg-white/10 dark:text-slate-300'}">${i + 1}</span>
        <span class="leading-snug">${esc(c.chapter_title)}</span></button>`;
    }).join('') || '<p class="px-3 py-6 text-sm text-slate-500">No chapter matches your search.</p>';
}
$('#chSearch').oninput = renderList;
$('#chList').onclick = e => {
  const b = e.target.closest('[data-ch]');
  if (b) {
    openChapter(+b.dataset.ch);
    if (window.matchMedia('(max-width: 767px)').matches) setSidebarOpen(false);
  }
};

const SEC = {
  q: {wrap:'px-9 py-7 bg-indigo-50/80 dark:bg-indigo-500/10', badge:'bg-gradient-to-r from-indigo-600 to-violet-600'},
  a: {wrap:'px-9 py-7', badge:'bg-gradient-to-r from-emerald-500 to-teal-500'},
  x: {wrap:'px-9 py-7', badge:'bg-gradient-to-r from-slate-600 to-slate-500'}
};
const sidebarToggle = $('#sidebarToggle');
const mobileSidebarQuery = window.matchMedia('(max-width: 767px)');
function setSidebarOpen(open) {
  document.body.classList.toggle('mobile-sidebar-open', mobileSidebarQuery.matches && open);
  document.body.classList.toggle('sidebar-collapsed', !mobileSidebarQuery.matches && !open);
  const label = open ? 'Close chapters sidebar' : 'Open chapters sidebar';
  sidebarToggle.setAttribute('aria-expanded', String(open));
  sidebarToggle.setAttribute('aria-label', label);
  sidebarToggle.title = label;
}
setSidebarOpen(!mobileSidebarQuery.matches);
let wasMobileSidebar = mobileSidebarQuery.matches;
window.addEventListener('resize', () => {
  if (wasMobileSidebar !== mobileSidebarQuery.matches) {
    wasMobileSidebar = mobileSidebarQuery.matches;
    setSidebarOpen(!wasMobileSidebar);
  }
});
$('#sidebarScrim').onclick = () => setSidebarOpen(false);
sidebarToggle.onclick = () => {
  const open = mobileSidebarQuery.matches
    ? !document.body.classList.contains('mobile-sidebar-open')
    : document.body.classList.contains('sidebar-collapsed');
  setSidebarOpen(open);
};
function tokenize(text) {
  const out = [], re = /\S+/g; let m;
  while ((m = re.exec(text))) out.push({w:m[0], s:m.index, e:m.index + m[0].length});
  return out;
}
function paraHTML(text, n) {
  const toks = tokenize(text);
  paras[n] = {text, tokens:toks};
  let html = '', last = 0;
  toks.forEach((t, i) => {
    html += esc(text.slice(last, t.s)) + `<span class="w" data-p="${n}" data-i="${i}">${esc(t.w)}</span>`;
    last = t.e;
  });
  return `<div class="para" id="para-${n}"><button class="spk" data-play="${n}" title="Listen to this paragraph" aria-label="Listen to this paragraph">${SPK}</button>
    <p class="font-read text-[19px] leading-9 text-slate-700 dark:text-slate-200">${html}</p></div>`;
}
function openChapter(i) {
  closePlayer(); synth.cancel();
  cur = i; paras = [];
  const ch = chapters[i]; let html = '', card = false, sec = false, kind = 'x', n = 0;
  const closeSec = () => { if (sec) { html += '</div>'; sec = false; } };
  const openSec = (k, label) => {
    closeSec();
    if (k === 'q' || !card) { if (card) html += '</section>'; html += '<section class="mb-8 overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-xl shadow-slate-200/60 dark:bg-slate-900/70 dark:border-white/10 dark:shadow-none">'; card = true; }
    kind = k;
    html += `<div class="${SEC[k].wrap}">` + (label ? `<span class="inline-block mb-4 rounded-full px-4 py-1.5 text-sm font-bold text-white shadow ${SEC[k].badge}">${esc(label)}</span>` : '');
    sec = true;
  };
  ch.content.forEach(it => {
    if (it.type === 'h2') {
      const k = /^\s*q/i.test(it.text) ? 'q' : /^\s*a/i.test(it.text) ? 'a' : 'x';
      openSec(k, it.text.replace(/:\s*$/, ''));
    } else {
      if (!sec) openSec('x', '');
      html += paraHTML(it.text, n++);
    }
  });
  closeSec(); if (card) html += '</section>';
  const prev = i > 0, next = i < chapters.length - 1;
  $('#reader').innerHTML = `
    <div class="text-center mb-12">
      <span class="inline-block rounded-full px-4 py-1.5 mb-5 text-sm font-semibold bg-indigo-100 text-indigo-700 dark:bg-indigo-400/15 dark:text-indigo-300">Chapter ${i + 1} of ${chapters.length}</span>
      <h2 class="text-4xl font-extrabold tracking-tight leading-tight text-slate-900 dark:text-white">${esc(ch.chapter_title)}</h2>
    </div>${html}
    <div class="flex justify-between gap-4 pt-4">
      <button data-ch="${i - 1}" ${prev ? '' : 'disabled'} class="rounded-xl px-5 py-3 text-sm font-semibold border border-slate-200 bg-white hover:bg-slate-50 disabled:opacity-30 disabled:pointer-events-none dark:bg-slate-900 dark:border-white/10">Previous chapter</button>
      <button data-ch="${i + 1}" ${next ? '' : 'disabled'} class="rounded-xl px-5 py-3 text-sm font-semibold text-white bg-gradient-to-r from-indigo-600 to-violet-600 shadow-lg shadow-indigo-500/30 disabled:opacity-30 disabled:pointer-events-none">Next chapter</button>
    </div>`;
  renderList(); window.scrollTo({top:0});
}

/* ---------- Single word ---------- */
function speakWord(word) {
  const clean = word.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, '');
  if (!clean) return;
  closePlayer(); synth.cancel();
  const u = new SpeechSynthesisUtterance(clean);
  if (voice) { u.voice = voice; u.lang = voice.lang; }
  u.rate = 0.85;
  synth.speak(u);
}

/* ---------- Paragraph player ---------- */
const P = {para:null, n:-1, idx:0, playing:false, id:0, rate:0.9};
let marked = null;

function mark(i) {
  if (marked) marked.classList.remove('on');
  marked = i < 0 || !P.para ? null : document.querySelector(`.w[data-p="${P.n}"][data-i="${i}"]`);
  if (marked) marked.classList.add('on');
}
function ui() {
  const len = P.para ? P.para.tokens.length : 0;
  $('#pPlay').innerHTML = P.playing ? PAUSE : PLAY;
  $('#pSeek').max = Math.max(len - 1, 0);
  $('#pSeek').value = P.idx;
  $('#pPos').textContent = `${Math.min(P.idx + 1, len)} / ${len} words`;
}
function playFrom(i) {
  const p = P.para; if (!p) return;
  const id = ++P.id; synth.cancel();
  P.idx = i; P.playing = true; ui();
  const T = p.tokens; let a = i;
  const next = () => {
    if (id !== P.id) return;
    if (a >= T.length) { P.playing = false; P.idx = 0; mark(-1); ui(); return; }
    let b = a;
    while (b < T.length - 1 && b - a < 28 && !/[.!?;:]["')\]]?$/.test(T[b].w)) b++;
    const base = T[a].s;
    const u = new SpeechSynthesisUtterance(p.text.slice(base, T[b].e));
    if (voice) { u.voice = voice; u.lang = voice.lang; }
    u.rate = P.rate;
    let k = a; P.idx = a; mark(a); ui();
    u.onboundary = e => {
      if (id !== P.id || e.name === 'sentence') return;
      const off = base + e.charIndex;
      while (k < b && T[k + 1].s <= off) k++;
      P.idx = k; mark(k); ui();
    };
    u.onend = () => { if (id === P.id) { a = b + 1; next(); } };
    u.onerror = e => { if (id === P.id && !/interrupted|canceled/.test(e.error)) { P.playing = false; ui(); } };
    synth.speak(u);
  };
  setTimeout(next, 50);
}
function stopAudio() { P.id++; synth.cancel(); P.playing = false; }
function openPlayer(n) {
  document.querySelectorAll('.para.playing').forEach(el => el.classList.remove('playing'));
  stopAudio(); mark(-1);
  P.para = paras[n]; P.n = n; P.idx = 0;
  $('#para-' + n).classList.add('playing');
  $('#pTitle').textContent = P.para.text.length > 80 ? P.para.text.slice(0, 80) + '…' : P.para.text;
  $('#player').classList.remove('translate-y-[160%]', 'opacity-0', 'pointer-events-none');
  $('#player').classList.add('pointer-events-auto');
  playFrom(0);
}
function closePlayer() {
  stopAudio(); mark(-1); P.para = null;
  document.querySelectorAll('.para.playing').forEach(el => el.classList.remove('playing'));
  $('#player').classList.add('translate-y-[160%]', 'opacity-0', 'pointer-events-none');
  $('#player').classList.remove('pointer-events-auto');
}
$('#pClose').onclick = closePlayer;
$('#pPlay').onclick = () => { if (!P.para) return; if (P.playing) { stopAudio(); ui(); } else playFrom(P.idx); };
$('#pBack').onclick = () => P.para && playFrom(Math.max(0, P.idx - 10));
$('#pFwd').onclick = () => P.para && playFrom(Math.min(P.para.tokens.length - 1, P.idx + 10));
$('#pSeek').oninput = e => { if (P.para) $('#pPos').textContent = `${+e.target.value + 1} / ${P.para.tokens.length} words`; };
$('#pSeek').onchange = e => P.para && playFrom(+e.target.value);
$('#pRate').onchange = e => { P.rate = +e.target.value; if (P.playing) playFrom(P.idx); };

/* ---------- Click handling in the reader ---------- */
$('#reader').addEventListener('click', e => {
  const w = e.target.closest('.w'), s = e.target.closest('[data-play]'), c = e.target.closest('[data-ch]');
  if (w) speakWord(w.textContent);
  else if (s) openPlayer(+s.dataset.play);
  else if (c && !c.disabled) openChapter(+c.dataset.ch);
});
window.addEventListener('beforeunload', () => synth.cancel());

/* ---------- Load book ---------- */
function showNotice(html) { const n = $('#notice'); n.innerHTML = html; n.classList.remove('hidden'); }
(async function init() {
  try {
    const r = await fetch('./JTM.json');
    if (!r.ok) throw new Error(`JTM.json could not be loaded (HTTP ${r.status})`);
    setBook(await r.json());
  } catch (err) {
    showNotice('<div class="rounded-2xl border border-rose-300 bg-rose-50 text-rose-800 px-5 py-4 text-sm leading-relaxed dark:bg-rose-500/10 dark:border-rose-400/30 dark:text-rose-200"><b>Could not load JTM.json.</b> Keep <code>JTM.json</code> in the same folder as <code>index.html</code> and open the page through a local server (for example VS Code Live Server).</div>');
    console.error('Failed to load JTM.json:', err);
  }
})();
</script>
</body>
</html>
